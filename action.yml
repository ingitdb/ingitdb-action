name: InGitDB repository validation
description: Validate a complete InGitDB repository with an exact, checksum-verified InGitDB CLI release
author: ingitdb

inputs:
  cli-version:
    description: Exact ingitdb/ingitdb-cli release tag, for example v0.65.13
    required: true
  database-root:
    description: Repository-relative root of the InGitDB database
    required: false
    default: .

outputs:
  terminal-category:
    description: Stable result category such as success, invalid_data, checksum_error, or validator_error
    value: ${{ steps.validate.outputs.terminal_category }}
  cli-version:
    description: Exact InGitDB CLI release tag used for validation
    value: ${{ steps.validate.outputs.cli_version }}
  database-root:
    description: Canonical repository-relative database root that was validated
    value: ${{ steps.validate.outputs.database_root }}
  validated-commit:
    description: Git commit supplied by the calling workflow
    value: ${{ steps.validate.outputs.validated_commit }}
  action-revision:
    description: Immutable action ref supplied by GitHub Actions
    value: ${{ steps.validate.outputs.action_revision }}
  started-at:
    description: UTC validation start time
    value: ${{ steps.validate.outputs.started_at }}
  completed-at:
    description: UTC validation completion time
    value: ${{ steps.validate.outputs.completed_at }}

runs:
  using: composite
  steps:
    - id: validate
      name: Validate complete repository
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_DATABASE_ROOT: ${{ inputs.database-root }}
        INGITDB_ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate.sh"
