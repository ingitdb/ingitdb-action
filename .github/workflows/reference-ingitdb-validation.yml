name: Reference InGitDB validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-ingitdb-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
      - name: Validate the complete InGitDB database
        uses: ingitdb/ingitdb-action@e5bf046ef02d9801d047149928e2adb0cb3d9b4e
        with:
          cli-version: v0.65.13
          database-root: test/fixtures/valid
